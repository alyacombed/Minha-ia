<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0b0f;
      --surface: #111218;
      --surface2: #181a22;
      --surface3: #1e2030;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --accent3: #38bdf8;
      --text: #e8eaf0;
      --text2: #9ca3b0;
      --text3: #5a6072;
      --user-bg: linear-gradient(135deg, #6c63ff 0%, #a78bfa 100%);
      --ai-bg: #181a22;
      --radius: 16px;
      --sidebar-w: 272px;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    .app { display: flex; height: 100vh; position: relative; overflow: hidden; }

    /* Sidebar overlay */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 25; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.visible { opacity: 1; pointer-events: all; }

    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border2);
      display: flex; flex-direction: column;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 18px 14px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .logo { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      box-shadow: 0 0 16px rgba(108,99,255,0.4);
    }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; }

    .btn-icon {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.2s; font-size: 18px;
    }
    .btn-icon:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-icon.close-btn:hover { background: rgba(255,80,80,0.2); color: #ff6b6b; border-color: rgba(255,80,80,0.3); }

    .chat-list { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

    .chat-item {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      border-radius: 10px; cursor: pointer; margin-bottom: 2px;
      border: 1px solid transparent; transition: all 0.15s; min-height: 44px;
    }
    .chat-item:hover { background: var(--surface2); border-color: var(--border); }
    .chat-item.active { background: var(--surface3); border-color: var(--border2); }
    .chat-icon { font-size: 14px; flex-shrink: 0; opacity: 0.7; }
    .chat-item-title {
      flex: 1; font-size: 13px; color: var(--text2); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .chat-item.active .chat-item-title { color: var(--text); }
    .chat-delete {
      opacity: 0; width: 22px; height: 22px; border-radius: 6px; border: none;
      background: transparent; color: var(--text3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.15s;
    }
    .chat-item:hover .chat-delete { opacity: 0.45; }
    .chat-delete:hover { opacity: 1 !important; background: rgba(255,80,80,0.2); color: #ff6b6b; }

    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .model-badge {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: var(--surface2); border-radius: 10px; border: 1px solid var(--border);
    }
    .model-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; box-shadow: 0 0 6px #4ade80; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .model-name { font-size: 12px; color: var(--text2); font-weight: 500; }
    .model-tag { margin-left: auto; font-size: 10px; background: rgba(108,99,255,0.2); color: var(--accent2); padding: 2px 7px; border-radius: 20px; font-weight: 600; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      height: 56px; min-height: 56px; background: var(--surface);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      padding: 0 16px; gap: 12px; z-index: 10;
    }
    .btn-toggle {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; gap: 3px; flex-direction: column; padding: 10px 9px;
    }
    .btn-toggle:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .burger-line { width: 100%; height: 1.5px; background: currentColor; border-radius: 2px; transition: all 0.2s; }
    .topbar-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .msg-count { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 3px 9px; border-radius: 20px; }
    .btn-new-chat {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 12px;
      font-family: 'DM Sans', sans-serif; transition: all 0.2s; white-space: nowrap;
    }
    .btn-new-chat:hover { background: rgba(108,99,255,0.15); border-color: var(--accent); color: var(--accent2); }

    /* Messages */
    .messages-area { flex: 1; overflow-y: auto; padding: 24px 0; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
    .messages-inner { max-width: 720px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; padding: 40px 20px; text-align: center;
    }
    .empty-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(167,139,250,0.2));
      display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px;
      border: 1px solid rgba(108,99,255,0.3); box-shadow: 0 0 40px rgba(108,99,255,0.15);
    }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: var(--text2); line-height: 1.6; max-width: 340px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
    .suggestion-chip {
      padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text2); font-size: 13px; cursor: pointer;
      transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--accent2); background: rgba(108,99,255,0.1); }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .avatar.ai { background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(56,189,248,0.3)); border: 1px solid rgba(108,99,255,0.3); }
    .avatar.user { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .msg-bubble {
      max-width: 78%; padding: 12px 16px; border-radius: 16px;
      line-height: 1.65; font-size: 14.5px;
    }
    .msg-bubble.ai { background: var(--ai-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
    .msg-bubble.user { background: var(--user-bg); border-bottom-right-radius: 4px; color: white; }

    .msg-time { font-size: 10px; margin-top: 5px; }
    .msg-bubble.ai .msg-time { color: var(--text3); }
    .msg-bubble.user .msg-time { color: rgba(255,255,255,0.5); text-align: right; }

    .md-content p { margin-bottom: 8px; }
    .md-content p:last-child { margin-bottom: 0; }
    .md-content h1, .md-content h2, .md-content h3 { font-family: 'Syne', sans-serif; font-weight: 600; margin: 12px 0 6px; color: var(--text); }
    .md-content h1 { font-size: 18px; }
    .md-content h2 { font-size: 16px; }
    .md-content h3 { font-size: 14px; }
    .md-content ul { padding-left: 18px; margin: 6px 0; }
    .md-content li { margin-bottom: 3px; }
    .inline-code { background: rgba(108,99,255,0.15); color: var(--accent2); padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .code-block { background: #0d0f1a; border: 1px solid var(--border2); border-radius: 10px; overflow: hidden; margin: 10px 0; }
    .code-lang { padding: 6px 12px; font-size: 11px; color: var(--text3); font-family: monospace; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
    .code-block pre { padding: 14px; overflow-x: auto; }
    .code-block code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; color: #a9b1d6; line-height: 1.6; }

    .thinking { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); display: block; animation: blink 1.2s ease-in-out infinite; }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1.1)} }

    /* Input */
    .input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 16px 20px; }
    .input-wrap { max-width: 720px; margin: 0 auto; }
    .input-box {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 14px; padding: 10px 14px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
    .input-textarea {
      flex: 1; background: transparent; border: none; outline: none; resize: none;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14.5px;
      line-height: 1.55; max-height: 160px; min-height: 22px;
      scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
    }
    .input-textarea::placeholder { color: var(--text3); }
    .send-btn {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; cursor: pointer; font-size: 17px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; box-shadow: 0 2px 10px rgba(108,99,255,0.4);
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 4px 18px rgba(108,99,255,0.6); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .input-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 8px; }

    .edit-title-input {
      flex: 1; background: var(--surface3); border: 1px solid var(--accent);
      border-radius: 6px; color: var(--text); font-size: 13px; padding: 2px 6px;
      font-family: 'DM Sans', sans-serif; outline: none; min-width: 0;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">✦</div>
          <span class="logo-text">Nova IA</span>
        </div>
        <button class="btn-icon" id="btnNewChatSidebar" title="Novo chat">＋</button>
        <button class="btn-icon close-btn" id="btnCloseSidebar" title="Fechar menu">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
      <div class="sidebar-footer">
        <div class="model-badge">
          <div class="model-dot"></div>
          <span class="model-name">Claude Sonnet 4.6</span>
          <span class="model-tag">Rápido</span>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <button class="btn-toggle" id="btnToggleSidebar" title="Chats">
          <div class="burger-line"></div>
          <div class="burger-line"></div>
          <div class="burger-line"></div>
        </button>
        <span class="topbar-title" id="topbarTitle">Chat</span>
        <div class="topbar-right">
          <span class="msg-count" id="msgCount" style="display:none"></span>
          <button class="btn-new-chat" id="btnNewChatTop">+ Novo</button>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <div class="input-area">
        <div class="input-wrap">
          <div class="input-box">
            <textarea
              id="inputTextarea"
              class="input-textarea"
              placeholder="Escreva uma mensagem… (Enter para enviar)"
              rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn" disabled title="Enviar">➤</button>
          </div>
          <div class="input-hint">Shift+Enter para nova linha · Duplo clique no título para renomear</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODEL_ID = "claude-sonnet-4-20250514";
    const SYSTEM_PROMPT = "Você é um assistente inteligente, amigável e prestativo. Responda sempre em português brasileiro, de forma clara e bem formatada. Use markdown quando útil.";
    const SUGGESTIONS = ["Explique como funciona IA", "Escreva um poema criativo", "Dicas de produtividade", "Roteiro de viagem"];

    // ── State ──
    let chats = [{ id: "1", title: "Novo chat", messages: [], createdAt: new Date() }];
    let activeChatId = "1";
    let isLoading = false;
    let editingTitleId = null;

    // ── Utils ──
    function generateId() { return Math.random().toString(36).slice(2, 10); }
    function formatTime(date) {
      return new Date(date).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function renderMarkdown(text) {
      return text
        .replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) =>
          `<div class="code-block"><div class="code-lang">${lang || "código"}</div><pre><code>${code.trim().replace(/</g,"&lt;").replace(/>/g,"&gt;")}</code></pre></div>`
        )
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/^#{3}\s(.+)$/gm, "<h3>$1</h3>")
        .replace(/^#{2}\s(.+)$/gm, "<h2>$1</h2>")
        .replace(/^#\s(.+)$/gm, "<h1>$1</h1>")
        .replace(/^[-*]\s(.+)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>")
        .replace(/\n\n/g, "</p><p>")
        .replace(/\n/g, "<br/>");
    }

    function getActiveChat() { return chats.find(c => c.id === activeChatId); }

    // ── Sidebar ──
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("visible");
    }
    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("visible");
    }

    document.getElementById("btnToggleSidebar").addEventListener("click", () => {
      sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
    });
    document.getElementById("btnCloseSidebar").addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // ── Chat management ──
    function createChat() {
      const id = generateId();
      chats.unshift({ id, title: "Novo chat", messages: [], createdAt: new Date() });
      activeChatId = id;
      document.getElementById("inputTextarea").value = "";
      closeSidebar();
      render();
    }

    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      if (chats.length === 0) {
        const nc = { id: generateId(), title: "Novo chat", messages: [], createdAt: new Date() };
        chats.push(nc);
        activeChatId = nc.id;
      } else if (activeChatId === id) {
        activeChatId = chats[0].id;
      }
      render();
    }

    function selectChat(id) {
      activeChatId = id;
      closeSidebar();
      render();
    }

    function updateChatTitle(id, title) {
      const chat = chats.find(c => c.id === id);
      if (chat) chat.title = title || "Sem título";
      editingTitleId = null;
      render();
    }

    // ── Render chat list ──
    function renderChatList() {
      const list = document.getElementById("chatList");
      list.innerHTML = "";
      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
        item.addEventListener("click", () => selectChat(chat.id));

        const icon = document.createElement("span");
        icon.className = "chat-icon";
        icon.textContent = "💬";

        if (editingTitleId === chat.id) {
          const input = document.createElement("input");
          input.className = "edit-title-input";
          input.value = chat.title;
          input.autofocus = true;
          input.addEventListener("click", e => e.stopPropagation());
          input.addEventListener("blur", () => updateChatTitle(chat.id, input.value));
          input.addEventListener("keydown", e => {
            if (e.key === "Enter") updateChatTitle(chat.id, input.value);
          });
          item.appendChild(icon);
          item.appendChild(input);
          setTimeout(() => input.focus(), 0);
        } else {
          const title = document.createElement("span");
          title.className = "chat-item-title";
          title.textContent = chat.title;
          title.addEventListener("dblclick", e => {
            e.stopPropagation();
            editingTitleId = chat.id;
            render();
          });
          item.appendChild(icon);
          item.appendChild(title);
        }

        const del = document.createElement("button");
        del.className = "chat-delete";
        del.title = "Deletar chat";
        del.innerHTML = `<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1L10 10M10 1L1 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
        del.addEventListener("click", e => { e.stopPropagation(); deleteChat(chat.id); });
        item.appendChild(del);

        list.appendChild(item);
      });
    }

    // ── Render messages ──
    function renderMessages() {
      const chat = getActiveChat();
      const inner = document.getElementById("messagesInner");
      inner.innerHTML = "";

      // Topbar
      document.getElementById("topbarTitle").textContent = chat?.title || "Chat";
      const msgCount = document.getElementById("msgCount");
      if (chat?.messages.length > 0) {
        msgCount.style.display = "";
        msgCount.textContent = chat.messages.length + " msgs";
      } else {
        msgCount.style.display = "none";
      }

      if (!chat || chat.messages.length === 0) {
        // Empty state
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `
          <div class="empty-icon">✦</div>
          <div class="empty-title">Como posso ajudar?</div>
          <div class="empty-sub">Sou o Nova IA, movido pelo Claude Sonnet 4.6. Pergunte qualquer coisa!</div>
          <div class="suggestions" id="suggestionsContainer"></div>
        `;
        inner.appendChild(empty);
        const sugContainer = document.getElementById("suggestionsContainer");
        SUGGESTIONS.forEach(s => {
          const btn = document.createElement("button");
          btn.className = "suggestion-chip";
          btn.textContent = s;
          btn.addEventListener("click", () => {
            const ta = document.getElementById("inputTextarea");
            ta.value = s;
            ta.focus();
            autoResizeTextarea(ta);
            updateSendBtn();
          });
          sugContainer.appendChild(btn);
        });
      } else {
        chat.messages.forEach(msg => {
          const row = document.createElement("div");
          row.className = "msg-row " + msg.role;

          const avatar = document.createElement("div");
          avatar.className = "avatar " + (msg.role === "assistant" ? "ai" : "user");
          avatar.textContent = msg.role === "assistant" ? "✦" : "🧑";

          const bubble = document.createElement("div");
          bubble.className = "msg-bubble " + (msg.role === "assistant" ? "ai" : "user");

          if (msg.role === "assistant") {
            const md = document.createElement("div");
            md.className = "md-content";
            md.innerHTML = "<p>" + renderMarkdown(msg.content) + "</p>";
            bubble.appendChild(md);
          } else {
            bubble.textContent = msg.content;
          }

          const time = document.createElement("div");
          time.className = "msg-time";
          time.textContent = formatTime(msg.time);
          bubble.appendChild(time);

          row.appendChild(avatar);
          row.appendChild(bubble);
          inner.appendChild(row);
        });

        if (isLoading) {
          const row = document.createElement("div");
          row.className = "msg-row";
          row.innerHTML = `
            <div class="avatar ai">✦</div>
            <div class="msg-bubble ai">
              <div class="thinking"><span></span><span></span><span></span></div>
            </div>
          `;
          inner.appendChild(row);
        }
      }

      // Scroll to bottom
      const area = document.getElementById("messagesArea");
      area.scrollTop = area.scrollHeight;
    }

    function render() {
      renderChatList();
      renderMessages();
    }

    // ── Textarea auto-resize ──
    function autoResizeTextarea(ta) {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }

    function updateSendBtn() {
      const ta = document.getElementById("inputTextarea");
      document.getElementById("sendBtn").disabled = !ta.value.trim() || isLoading;
    }

    const textarea = document.getElementById("inputTextarea");
    textarea.addEventListener("input", () => {
      autoResizeTextarea(textarea);
      updateSendBtn();
    });

    // ── Send message ──
    async function sendMessage() {
      const text = textarea.value.trim();
      if (!text || isLoading) return;

      const currentChatId = activeChatId;
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      const userMsg = { id: generateId(), role: "user", content: text, time: new Date() };

      // Auto title
      if (chat.messages.length === 0) {
        chat.title = text.slice(0, 36) + (text.length > 36 ? "…" : "");
      }
      chat.messages.push(userMsg);
      textarea.value = "";
      autoResizeTextarea(textarea);
      isLoading = true;
      updateSendBtn();
      render();

      try {
        const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));

        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODEL_ID,
            max_tokens: 1000,
            system: SYSTEM_PROMPT,
            messages: apiMessages,
          }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err?.error?.message || "HTTP " + response.status);
        }

        const data = await response.json();
        const reply = data?.content?.find(b => b.type === "text")?.text || "Não consegui obter uma resposta.";

        const targetChat = chats.find(c => c.id === currentChatId);
        if (targetChat) {
          targetChat.messages.push({ id: generateId(), role: "assistant", content: reply, time: new Date() });
        }
      } catch (e) {
        const targetChat = chats.find(c => c.id === currentChatId);
        if (targetChat) {
          targetChat.messages.push({
            id: generateId(), role: "assistant",
            content: "⚠️ Erro: " + (e.message || "Falha ao conectar com a IA."),
            time: new Date()
          });
        }
      } finally {
        isLoading = false;
        updateSendBtn();
        render();
      }
    }

    textarea.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("btnNewChatSidebar").addEventListener("click", createChat);
    document.getElementById("btnNewChatTop").addEventListener("click", createChat);

    // ── Init ──
    render();
  </script>
</body>
</html>
