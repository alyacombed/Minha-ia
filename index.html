<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova IA</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#0a0b0f;
      --surface:#111218;
      --surface2:#181a22;
      --surface3:#1e2030;
      --border:rgba(255,255,255,0.07);
      --border2:rgba(255,255,255,0.12);
      --accent:#6c63ff;
      --accent2:#a78bfa;
      --text:#e8eaf0;
      --text2:#9ca3b0;
      --text3:#5a6072;
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    .app{
      display:flex;
      height:100vh;
    }

    .sidebar{
      width:280px;
      background:var(--surface);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
    }

    .sidebar-header{
      padding:20px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo-icon{
      width:35px;
      height:35px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    .logo-text{
      font-family:'Syne',sans-serif;
      font-weight:700;
    }

    .new-chat{
      width:35px;
      height:35px;
      border:none;
      border-radius:10px;
      background:var(--surface2);
      color:white;
      cursor:pointer;
      font-size:20px;
    }

    .chat-list{
      flex:1;
      overflow-y:auto;
      padding:10px;
    }

    .chat-item{
      padding:12px;
      border-radius:10px;
      background:var(--surface2);
      margin-bottom:8px;
      cursor:pointer;
      font-size:14px;
    }

    .chat-item.active{
      border:1px solid var(--accent);
    }

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      height:60px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      padding:0 20px;
      background:var(--surface);
      font-family:'Syne',sans-serif;
      font-weight:600;
    }

    .messages{
      flex:1;
      overflow-y:auto;
      padding:20px;
    }

    .messages-inner{
      max-width:800px;
      margin:auto;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .message{
      display:flex;
      gap:10px;
    }

    .message.user{
      justify-content:flex-end;
    }

    .bubble{
      max-width:75%;
      padding:14px 16px;
      border-radius:16px;
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      word-wrap:break-word;
    }

    .user .bubble{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      border-bottom-right-radius:4px;
    }

    .assistant .bubble{
      background:var(--surface2);
      border:1px solid var(--border);
      border-bottom-left-radius:4px;
    }

    .input-area{
      padding:20px;
      border-top:1px solid var(--border);
      background:var(--surface);
    }

    .input-box{
      max-width:800px;
      margin:auto;
      display:flex;
      gap:10px;
      background:var(--surface2);
      border:1px solid var(--border2);
      border-radius:14px;
      padding:10px;
    }

    textarea{
      flex:1;
      background:none;
      border:none;
      outline:none;
      resize:none;
      color:white;
      font-size:14px;
      font-family:'DM Sans',sans-serif;
      min-height:24px;
      max-height:150px;
    }

    textarea::placeholder{
      color:var(--text3);
    }

    .send-btn{
      width:45px;
      height:45px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      cursor:pointer;
      font-size:18px;
    }

    .empty{
      text-align:center;
      margin-top:100px;
    }

    .empty h1{
      font-family:'Syne',sans-serif;
      margin-bottom:10px;
    }

    .typing{
      display:flex;
      gap:5px;
      align-items:center;
    }

    .typing span{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent2);
      animation:blink 1.2s infinite;
    }

    .typing span:nth-child(2){
      animation-delay:.2s;
    }

    .typing span:nth-child(3){
      animation-delay:.4s;
    }

    @keyframes blink{
      0%,80%,100%{
        opacity:.2;
        transform:scale(.8);
      }
      40%{
        opacity:1;
        transform:scale(1);
      }
    }
  </style>
</head>
<body>

<div class="app">

  <div class="sidebar">

    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">✦</div>
        <div class="logo-text">Nova IA</div>
      </div>

      <button class="new-chat" onclick="createChat()">+</button>
    </div>

    <div class="chat-list" id="chatList"></div>

  </div>

  <div class="main">

    <div class="topbar" id="chatTitle">
      Novo chat
    </div>

    <div class="messages">
      <div class="messages-inner" id="messages"></div>
    </div>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          placeholder="Digite uma mensagem..."
          rows="1"
        ></textarea>

        <button class="send-btn" onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>

  </div>

</div>

<script>

const API_KEY = "SUA_API_KEY_AQUI";

let chats = JSON.parse(localStorage.getItem("nova_chats")) || [];
let activeChatId = null;

function saveChats(){
  localStorage.setItem("nova_chats", JSON.stringify(chats));
}

function generateId(){
  return Math.random().toString(36).substring(2,10);
}

function createChat(){

  const chat = {
    id: generateId(),
    title: "Novo chat",
    messages:[]
  };

  chats.unshift(chat);

  activeChatId = chat.id;

  saveChats();

  renderChats();
  renderMessages();
}

function getActiveChat(){
  return chats.find(c => c.id === activeChatId);
}

function renderChats(){

  const list = document.getElementById("chatList");

  list.innerHTML = "";

  chats.forEach(chat => {

    const div = document.createElement("div");

    div.className = "chat-item" + (chat.id === activeChatId ? " active":"");

    div.innerText = chat.title;

    div.onclick = () => {
      activeChatId = chat.id;
      renderChats();
      renderMessages();
    };

    list.appendChild(div);

  });

}

function renderMessages(){

  const container = document.getElementById("messages");

  const title = document.getElementById("chatTitle");

  const chat = getActiveChat();

  if(!chat) return;

  title.innerText = chat.title;

  container.innerHTML = "";

  if(chat.messages.length === 0){

    container.innerHTML = `
      <div class="empty">
        <h1>Como posso ajudar?</h1>
        <p>Sou o Nova IA.</p>
      </div>
    `;

    return;
  }

  chat.messages.forEach(msg => {

    const div = document.createElement("div");

    div.className = "message " + msg.role;

    div.innerHTML = `
      <div class="bubble">${escapeHtml(msg.content)}</div>
    `;

    container.appendChild(div);

  });

  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text){

  return text
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");

}

async function sendMessage(){

  const input = document.getElementById("input");

  const text = input.value.trim();

  if(!text) return;

  const chat = getActiveChat();

  if(chat.messages.length === 0){
    chat.title = text.slice(0,30);
  }

  chat.messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  renderChats();
  renderMessages();

  const container = document.getElementById("messages");

  const typing = document.createElement("div");

  typing.className = "message assistant";

  typing.id = "typing";

  typing.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  container.appendChild(typing);

  container.scrollTop = container.scrollHeight;

  try{

    const response = await fetch("https://api.anthropic.com/v1/messages",{

      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "x-api-key":API_KEY,
        "anthropic-version":"2023-06-01"
      },

      body:JSON.stringify({

        model:"claude-sonnet-4-20250514",

        max_tokens:1000,

        messages:[
          {
            role:"user",
            content:text
          }
        ]

      })

    });

    const data = await response.json();

    document.getElementById("typing")?.remove();

    const reply =
      data?.content?.[0]?.text ||
      "Erro ao gerar resposta.";

    chat.messages.push({
      role:"assistant",
      content:reply
    });

    saveChats();

    renderMessages();

  }catch(e){

    document.getElementById("typing")?.remove();

    chat.messages.push({
      role:"assistant",
      content:"Erro ao conectar na IA."
    });

    renderMessages();

  }

}

document.getElementById("input").addEventListener("keydown",(e)=>{

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();

    sendMessage();

  }

});

if(chats.length === 0){
  createChat();
}else{
  activeChatId = chats[0].id;
  renderChats();
  renderMessages();
}

</script>

</body>
</html>
